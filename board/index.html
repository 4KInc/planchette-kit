<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; script-src 'self' 'wasm-unsafe-eval'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planchette</title>
    <link rel="stylesheet" href="../apps/board/board.css" />
  </head>
  <body>
    <header class="visually-hidden">
      <h1 data-text="page.heading"></h1>
    </header>
    <main class="page">
      <section aria-labelledby="message-title" class="message">
        <h2 id="message-title" class="visually-hidden" data-text="page.messageTitle"></h2>
        <p id="message-bar" role="status"></p>
      </section>
      <section aria-labelledby="core-title" class="board">
        <h2 id="core-title" class="visually-hidden" data-text="page.coreTitle"></h2>
        <div id="core-grid" class="core-grid"></div>
      </section>
      <section aria-labelledby="letter-title" class="board" hidden>
        <h2 id="letter-title" class="visually-hidden" data-text="page.letterTitle"></h2>
        <div id="letter-grid" class="letter-grid" hidden></div>
      </section>
      <section aria-labelledby="phrases-title" class="board" hidden>
        <h2 id="phrases-title" class="visually-hidden" data-text="page.phrasesTitle"></h2>
        <div id="phrases-grid" class="phrases-grid" hidden></div>
      </section>
      <p id="phrases-page" class="visually-hidden" role="status" aria-live="polite"></p>
      <div class="side">
        <div id="prediction-strip" class="prediction-strip"></div>
        <section aria-labelledby="actions-title" class="actions-section">
          <h2 id="actions-title" class="visually-hidden" data-text="page.actionsTitle"></h2>
          <div class="actions">
            <button type="button" class="target" data-planchette-target="speak" data-text="actions.speak"></button>
            <button type="button" class="target" data-planchette-target="backspace-action" data-text="actions.backspace"></button>
            <button type="button" class="target" data-planchette-target="clear" data-text="actions.clear"></button>
            <button type="button" class="target" data-planchette-target="undo" data-role="undo" data-text="actions.undo"></button>
            <button type="button" class="target" data-planchette-target="spell-toggle" aria-pressed="false" data-text="actions.spell"></button>
            <button type="button" class="target" data-planchette-target="cancel" data-role="cancel" data-text="actions.cancel"></button>
          </div>
        </section>
        <div class="camera-rest">
          <button type="button" class="target" data-planchette-target="camera-toggle" aria-pressed="false"></button>
          <button type="button" class="target" data-planchette-target="phrases-toggle" aria-pressed="false" data-text="actions.phrases"></button>
          <div class="rest" id="rest-area" data-planchette-target="rest-area" data-role="rest-area" role="group" data-aria-label="page.restAreaHelp">
            <p data-text="page.restArea"></p>
          </div>
        </div>
        <section aria-labelledby="controls-title" class="controls">
          <h2 id="controls-title" class="visually-hidden" data-text="page.controlsTitle"></h2>
          <div class="controls-row">
            <label for="mode"></label>
            <select id="mode"></select>
            <button type="button" id="settings-button" data-text="controls.settings"></button>
          </div>
        </section>
        <div id="status-panel">
          <div id="camera-status"></div>
          <p id="controls-message" role="status"></p>
        </div>
        <footer>
          <p id="notice" data-text="notMedicalDevice"></p>
        </footer>
      </div>
    </main>
    <dialog id="settings" aria-labelledby="settings-title">
      <h2 id="settings-title" data-text="settings.title"></h2>
      <div id="settings-main">
        <div id="settings-sections"></div>
        <section aria-labelledby="settings-calibrate-title" class="settings-group">
          <h3 id="settings-calibrate-title" data-text="controls.calibrate"></h3>
          <p class="help" data-text="settings.calibrateHelp"></p>
          <button type="button" id="calibrate"></button>
          <p id="settings-message" role="status"></p>
        </section>
      </div>
      <section id="about" aria-labelledby="about-title" hidden>
        <h3 id="about-title" data-text="aboutScreen.title"></h3>
        <div id="about-body"></div>
        <button type="button" id="about-back" data-text="settings.back"></button>
      </section>
      <div class="dialog-actions">
        <button type="button" id="about-button" data-text="settings.about"></button>
        <button type="button" id="settings-close" data-text="settings.close"></button>
      </div>
    </dialog>
    <script type="module" src="../apps/board/src/entry.ts"></script>
  </body>
</html>
